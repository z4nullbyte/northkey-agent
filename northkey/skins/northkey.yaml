spinner:
  waiting_faces: ["∙", "✧", "✦", "✧"]
  thinking_faces: ["✦", "✧", "⟡", "✧"]
  thinking_verbs:
    - orienting
    - taking a bearing
    - reading the terrain
    - charting a course
    - aligning
    - tracing the path
    - weighing options
    - composing
    - refining

branding:
  agent_name: Northkey
  welcome: "Northkey is ready. Type a message, or /help for commands."
  goodbye: "Until next time. ✦"
  response_label: " ✦ Northkey "
  prompt_symbol: "›"
  help_header: "✦ Commands"

tool_prefix: "╎"

