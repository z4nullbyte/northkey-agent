customCSS: |-
  /* Northkey desktop accents: hairline focus rings, restrained motion. */
  :root { --nk-glacier: #8CCFE0; --nk-champagne: #D9C29C; }
  *:focus-visible { outline: 1px solid var(--nk-glacier); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
