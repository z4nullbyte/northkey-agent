# Northkey: quiet luxury for the terminal.
#
# Graphite neutrals, one glacial accent, and a champagne metallic kept for the
# ✦ mark. Dark-authored ("Nocturne") with a hand-tuned light overlay ("Cloud").
# Registered as a built-in skin by hermes_cli/northkey_brand.py, so upstream's
# palette audit (tests/hermes_cli/test_skin_palettes.py) checks it on every sync.
# Glyphs are East-Asian-Width Neutral: one cell wide in every locale.
# Regenerate the art with: python northkey/design/marks.py

name: northkey
description: Northkey. Graphite, glacier and champagne, in quiet luxury.

colors:
  background: "#0B0D10"          # ink: GUI base surface
  ui_text: "#E6E8EB"
  ui_border: "#2A2F37"
  banner_border: "#5A6270"       # hairline
  banner_title: "#D9C29C"        # champagne, reserved for the mark and titles
  banner_accent: "#8CCFE0"       # glacier, the one accent
  banner_dim: "#8A919C"
  banner_text: "#E6E8EB"         # platinum
  ui_accent: "#8CCFE0"
  ui_label: "#A3AAB5"            # pewter
  ui_ok: "#7CC6A0"
  ui_error: "#F0877E"
  ui_warn: "#E3B66B"
  prompt: "#E6E8EB"
  input_rule: "#5A6270"
  response_border: "#4F7F8C"     # glacier hairline
  status_bar_bg: "#0B0D10"
  status_bar_text: "#A3AAB5"
  status_bar_strong: "#E6E8EB"
  status_bar_dim: "#6B7380"
  status_bar_good: "#7CC6A0"
  status_bar_warn: "#E3B66B"
  status_bar_bad: "#F0A36E"
  status_bar_critical: "#F0877E"
  session_label: "#D9C29C"
