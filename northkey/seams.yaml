# Northkey seam manifest.
#
# The fork's tree is ALWAYS exactly:
#     upstream tree (commit pinned in northkey/upstream.lock.json)
#   + Northkey-owned paths (the `owned` globs below; upstream never has them)
#   + the seams below, applied to the pristine upstream text.
#
# `nk.py verify` enforces that invariant (exact tree comparison, modes included),
# and `nk.py sync` rebuilds the tree from it on every upstream update. That is why
# upstream updates never conflict with the rebrand: seam files are re-derived from
# fresh upstream text each time.
#
# Rules:
#   * Each edit is a literal `find` -> `replace` on the file's bytes, applied `count`
#     times (default 1; `all` = every occurrence, at least one). Counts must match.
#   * `replace` may use ⟦key⟧ placeholders from northkey/brand.yaml, plus derived keys:
#     repo.slug, repo.git_url, install.sh_url, install.ps1_url, install.cmd_url.
#   * `required: false` marks a cosmetic seam: when upstream moves its anchor, the
#     sync skips it (reported in the sync commit) instead of stopping. Update-path,
#     security, identity and attribution seams stay required: a moved anchor stops
#     the sync loudly so they can never silently regress.
#   * Prefer one-line anchors. Multi-line anchors use double-quoted YAML with \n so
#     indentation is exact. Never rename modules, commands, HERMES_* variables or
#     ~/.hermes: the updater's compatibility contract depends on them.

version: 1

owned:
  - northkey/**
  - tests/northkey/**
  - hermes_cli/northkey_brand.py
  - NOTICE
  - .github/README.md
  - .github/SECURITY.md
  - .github/workflows/northkey-*.yml

# Primary user-visible surfaces scanned by `nk.py leaks` for upstream brand strings.
surfaces:
  - hermes_cli/banner.py
  - hermes_cli/cli_render.py
  - hermes_cli/cli_status_bar_mixin.py
  - hermes_cli/cli_tui_mixin.py
  - hermes_cli/cli_commands_mixin.py
  - hermes_cli/setup.py
  - hermes_cli/_parser.py
  - hermes_cli/update_cmd.py
  - scripts/install.sh
  - scripts/install.ps1
  - scripts/install.cmd
  - ui-tui/src/components/branding.tsx
  - ui-tui/src/app/userMessages.ts
  - web/src/App.tsx
  - web/src/components/SidebarFooter.tsx
  - web/index.html
  - gateway/platforms/base_exec_approval.py
  - gateway/run_notifications.py

seams:
  # ── Updates: installs follow the Northkey fork, never Nous directly ───────────
  - id: update-channel-authority
    file: hermes_cli/source_releases.py
    why: >-
      Channel names other than main/stable/canary still go through the release
      archive; it must be the fork's, never Nous's (whose records name NousResearch).
    edits:
      - find: '_PUBLIC_BASE = "https://hermes-assets.nousresearch.com"'
        replace: '_PUBLIC_BASE = "⟦channels.base_url⟧"  # northkey: fork-owned channel archive'
      - find: 'OFFICIAL_REPOSITORY = "NousResearch/hermes-agent"'
        replace: 'OFFICIAL_REPOSITORY = "⟦repo.slug⟧"  # northkey'
      - find: "    repository = repository or source_repository(git_cmd, cwd)\n    try:\n"
        replace: "    repository = repository or source_repository(git_cmd, cwd)\n    if channel in (\"main\", \"stable\", \"canary\"):  # northkey: installs follow the fork's branch, no archive round-trip\n        return SourceTarget(channel, \"main\", repository, branch=\"⟦repo.branch⟧\")\n    try:\n"

  - id: update-official-origin
    file: hermes_cli/update_cmd_git.py
    why: >-
      A Northkey origin is the official source for Northkey installs, so users are
      never prompted to add Nous as `upstream` and the SSH hint keeps them on the fork.
    edits:
      - find: 'OFFICIAL_REPO_URLS = {'
        replace: "OFFICIAL_REPO_URLS = {  # northkey: the fork is the official origin of Northkey installs\n    \"https://github.com/⟦repo.slug⟧.git\",\n    \"git@github.com:⟦repo.slug⟧.git\",\n    \"https://github.com/⟦repo.slug⟧\",\n    \"git@github.com:⟦repo.slug⟧\","
      - find: 'OFFICIAL_REPO_URL = "https://github.com/NousResearch/hermes-agent.git"'
        replace: 'OFFICIAL_REPO_URL = "⟦repo.git_url⟧"  # northkey'
      - find: 'git remote set-url origin https://github.com/NousResearch/hermes-agent.git'
        replace: 'git remote set-url origin ⟦repo.git_url⟧'
      - find: '_UPSTREAM_ADD_CMD = "git remote add upstream https://github.com/NousResearch/hermes-agent.git"'
        replace: '_UPSTREAM_ADD_CMD = "git remote add upstream ⟦repo.git_url⟧"  # northkey'
      - find: 'Your fork is not tracking the official Hermes repository.'
        replace: 'Your fork is not tracking the official ⟦name⟧ repository.'
      - find: 'This means you may miss updates from NousResearch/hermes-agent.'
        replace: 'This means you may miss updates from ⟦repo.slug⟧.'
      - find: 'print("  ✓ Added upstream: https://github.com/NousResearch/hermes-agent.git")'
        replace: 'print("  ✓ Added upstream: ⟦repo.git_url⟧")'

  - id: update-check-compare
    file: hermes_cli/update_cmd_check.py
    why: >-
      `update --check` compared against any `upstream` remote (Nous, in a maintainer
      clone or a migrated install) and reported updates `update` never delivers.
    edits:
      - find: '        if _git(git_cmd, root, ["remote", "get-url", "upstream"]).returncode == 0:'
        replace: '        if _uc()._is_fork(_uc()._get_origin_url(git_cmd, root)) and _git(git_cmd, root, ["remote", "get-url", "upstream"]).returncode == 0:  # northkey: a fork origin is canonical'

  - id: update-zip-fallback
    file: hermes_cli/update_cmd_zip.py
    why: The no-git (ZIP) update path must download the fork, and its recovery hint must reinstall the fork.
    edits:
      - find: 'repository = target_repository or "NousResearch/hermes-agent"'
        replace: 'repository = target_repository or "⟦repo.slug⟧"  # northkey'
      - find: 'reinstall from https://hermes-agent.nousresearch.com")'
        replace: 'reinstall with: irm ⟦install.ps1_url⟧ | iex")'

  - id: installer-origin-sh
    file: scripts/install.sh
    why: >-
      Fresh installs clone the fork as `origin`; re-running the installer over a Hermes
      checkout moves it to the fork; the banner states the origin truthfully.
    edits:
      - find: 'REPO_URL="${HERMES_REPO_URL:-https://github.com/NousResearch/hermes-agent.git}"'
        replace: 'REPO_URL="${HERMES_REPO_URL:-⟦repo.git_url⟧}"  # northkey'
      - find: '        if [ -n "${HERMES_REPO_URL:-}" ]; then'
        replace: '        if [ -n "${HERMES_REPO_URL:-}" ] || git -C "$INSTALL_DIR" remote get-url origin 2>/dev/null | grep -qiE ''github\.com[:/]+NousResearch/hermes-agent(\.git)?/?$''; then  # northkey: move Hermes checkouts to the fork'
      - find: '│  An open source AI agent by Nous Research.              │'
        replace: '│  Built on Hermes Agent by Nous Research (MIT).          │'

  - id: installer-origin-ps1
    file: scripts/install.ps1
    why: >-
      Fresh installs clone the fork as `origin`; re-running the installer over a Hermes
      checkout moves it to the fork; the banner states the origin truthfully.
    edits:
      - find: '$RepoUrl = if ($env:HERMES_REPO_URL) { $env:HERMES_REPO_URL } else { "https://github.com/NousResearch/hermes-agent.git" }'
        replace: '$RepoUrl = if ($env:HERMES_REPO_URL) { $env:HERMES_REPO_URL } else { "⟦repo.git_url⟧" }  # northkey'
      - find: "        if ($env:HERMES_REPO_URL) {\n            Invoke-Native { git -C $InstallDir remote set-url origin $RepoUrl }"
        replace: "        if ($env:HERMES_REPO_URL -or ((Invoke-Native { git -C $InstallDir remote get-url origin 2>$null }) -match 'github\\.com[:/]+NousResearch/hermes-agent(\\.git)?/?$')) {  # northkey: move Hermes checkouts to the fork\n            Invoke-Native { git -C $InstallDir remote set-url origin $RepoUrl }"
      - find: '|  An open source AI agent by Nous Research.              |'
        replace: '|  Built on Hermes Agent by Nous Research (MIT).          |'

  - id: installer-cmd
    file: scripts/install.cmd
    why: The CMD wrapper must launch the fork's installer, not Nous's hosted one.
    edits:
      - find: 'https://hermes-agent.nousresearch.com/install.ps1'
        replace: '⟦install.ps1_url⟧'
        count: 3
      - find: 'https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.cmd'
        replace: '⟦install.cmd_url⟧'
      - find: 'Hermes Agent Installer'
        replace: '⟦name⟧ Installer'
        count: 2

  - id: reinstall-hints
    file: hermes_cli/uninstall.py
    why: Recovery one-liners reinstall Northkey; uninstall removes the `northkey` command too.
    edits:
      - find: 'https://hermes-agent.nousresearch.com/install.ps1'
        replace: '⟦install.ps1_url⟧'
      - find: 'https://hermes-agent.nousresearch.com/install.sh'
        replace: '⟦install.sh_url⟧'
      - find: '        Path.home() / ".local" / "bin" / "hermes-agent",'
        replace: "        Path.home() / \".local\" / \"bin\" / \"hermes-agent\",\n        Path.home() / \".local\" / \"bin\" / \"⟦command⟧\",  # northkey"

  - id: reinstall-hints-update
    file: hermes_cli/update_cmd.py
    why: Recovery one-liners must reinstall Northkey, not upstream Hermes.
    edits:
      - find: 'https://hermes-agent.nousresearch.com/install.sh'
        replace: '⟦install.sh_url⟧'

  - id: reinstall-hints-maint
    file: hermes_cli/update_cmd_maint.py
    why: Recovery one-liners must reinstall Northkey, not upstream Hermes.
    edits:
      - find: 'https://hermes-agent.nousresearch.com/install.ps1'
        replace: '⟦install.ps1_url⟧'
      - find: 'https://hermes-agent.nousresearch.com/install.sh'
        replace: '⟦install.sh_url⟧'

  # ── Command: `northkey` is an alias that runs the `hermes` launcher ───────────
  # One process identity: gateway/profile/update process matchers keep working.
  - id: command-alias
    file: hermes_cli/_launchers.py
    why: >-
      POSIX: ~/.local/bin/northkey forwards to the install's .hermes/bin/hermes (as
      hermes-agent does). Windows: northkey.cmd next to hermes calls it, written inline
      (launcher publication runs from a minimal boot file set). Install and every
      update republish both.
    edits:
      - find: '                   if name == "hermes-agent" else [str(root / ".hermes/bin" / name)])'
        replace: '                   if name == "hermes-agent" else [str(root / ".hermes/bin" / ("hermes" if name == "⟦command⟧" else name))])  # northkey: alias'
      - find: '(*WINDOWS_BIN_LAUNCHERS, "hermes-agent")'
        replace: '(*WINDOWS_BIN_LAUNCHERS, "hermes-agent", "⟦command⟧")'
      - find: "    Path(out_dir).mkdir(parents=True, exist_ok=True)\n    return [str(path) for name in WINDOWS_BIN_LAUNCHERS\n            if (path := stage_launcher(name, root, Path(out_dir))) is not None]\n"
        replace: "    Path(out_dir).mkdir(parents=True, exist_ok=True)\n    staged = [str(path) for name in WINDOWS_BIN_LAUNCHERS\n              if (path := stage_launcher(name, root, Path(out_dir))) is not None]\n    if len(staged) == len(WINDOWS_BIN_LAUNCHERS):  # northkey: `⟦command⟧` forwards to hermes\n        try:\n            (Path(out_dir) / \"⟦command⟧.cmd\").write_bytes(b'@call \"%~dp0hermes\" %*\\r\\n')\n        except OSError:\n            pass\n    return staged\n"

  # ── Secure-by-default configuration (Northkey hardening) ─────────────────────
  - id: harden-defaults
    file: hermes_cli/config_defaults.py
    why: >-
      Upstream's defaults suit a trusting local developer. Northkey ships stricter
      ones; every value stays user-overridable in config.yaml.
    edits:
      - find: '        "mode": "smart",'
        replace: '        "mode": "manual",  # northkey: a human approves every flagged command'
      - find: '        "strict": False,'
        replace: '        "strict": True,  # northkey: only allow-listed files leave as chat media'
      - find: '        "keyless_fallback": True,'
        replace: '        "keyless_fallback": False,  # northkey: no silent third-party search tiers'
      - find: '        "keyless_rescue": True,'
        replace: '        "keyless_rescue": False,  # northkey'
      - find: '        "adopt_external_logins": True,'
        replace: '        "adopt_external_logins": False,  # northkey: never borrow other tools'' logins'
      - find: '        "guard_agent_created": False,'
        replace: '        "guard_agent_created": True,  # northkey: scan skills the agent writes'

  - id: harden-config-template
    file: cli-config.yaml.example
    why: >-
      Installers copy this template to config.yaml verbatim, so its live keys would
      override the Northkey defaults above.
    edits:
      - find: "\n  skin: default\n"
        replace: "\n  skin: ⟦skin.default⟧  # northkey\n"
      - find: "\n  adopt_external_logins: true\n"
        replace: "\n  adopt_external_logins: false  # northkey: never borrow other tools' logins\n"
      - find: '  #   default        — Classic Hermes gold/kawaii'
        replace: "  #   ⟦skin.default⟧       — ⟦name⟧: graphite, glacier and champagne (default)\n  #   default        — Classic Hermes gold/kawaii"

  - id: harden-gateway-media
    file: gateway/media_policy.py
    why: >-
      The gateway bridges media policy from the user's config only, so without an
      explicit gateway.strict it fell back to non-strict. Strict unless opted out.
    edits:
      - find: '        return bool(cfg.get("strict", False))'
        replace: '        return bool(cfg.get("strict", True))  # northkey: strict unless gateway.strict: false'
      - find: '    return os.environ.get(_FLAG_ENVS[0][1], "0").strip().lower() in _TRUTHY'
        replace: '    return os.environ.get(_FLAG_ENVS[0][1], "1").strip().lower() in _TRUTHY  # northkey'

  # ── Brand: look, name and identity ───────────────────────────────────────────
  - id: brand-skin-registry
    file: hermes_cli/skin_engine.py
    why: >-
      Registers northkey/skins/*.yaml as built-in skins for every profile (upstream's
      palette audit then checks them), and makes the brand skin the fallback.
    edits:
      - find: 'def list_skins() -> List[Dict[str, str]]:'
        replace: "# northkey: register the bundled Northkey skins (northkey/skins/*.yaml) as built-ins.\ntry:\n    from hermes_cli.northkey_brand import bundled_skins as _northkey_bundled_skins\n    _BUILTIN_SKINS.update(_northkey_bundled_skins())\nexcept Exception:  # branding must never break startup\n    logger.debug(\"Northkey skins unavailable\", exc_info=True)\n\n\ndef list_skins() -> List[Dict[str, str]]:"
      - find: '    skin_name = display.get("skin", "default") if isinstance(display, dict) else "default"'
        replace: '    skin_name = display.get("skin", "⟦skin.default⟧") if isinstance(display, dict) else "⟦skin.default⟧"  # northkey'

  - id: brand-default-skin
    file: hermes_cli/config_defaults.py
    why: New profiles start on the Northkey skin and dashboard theme; explicit choices still win.
    edits:
      - find: '        "skin": "default",'
        replace: '        "skin": "⟦skin.default⟧",  # northkey'
      - find: '        "theme": "default",'
        replace: '        "theme": "⟦skin.default⟧",  # northkey'

  - id: brand-default-skin-cli
    file: hermes_cli/cli_config_load.py
    why: The classic CLI builds its own defaults without DEFAULT_CONFIG.
    edits:
      - find: '            "skin": "default",'
        replace: '            "skin": "⟦skin.default⟧",  # northkey'

  - id: brand-default-skin-tui
    file: tui_gateway/change_watcher.py
    why: The TUI/desktop skin payload reads raw config without DEFAULT_CONFIG.
    edits:
      - find: '    name = str((_load_cfg().get("display") or {}).get("skin") or "default")'
        replace: '    name = str((_load_cfg().get("display") or {}).get("skin") or "⟦skin.default⟧")  # northkey'

  - id: brand-default-skin-tui-config
    file: tui_gateway/methods_config.py
    why: The TUI's /skin reports the raw config value; its fallback must match.
    edits:
      - find: '    "skin": lambda params: {"value": _display_raw().get("skin", "default")},'
        replace: '    "skin": lambda params: {"value": _display_raw().get("skin", "⟦skin.default⟧")},  # northkey'

  - id: brand-identity
    file: agent/prompt_builder.py
    why: >-
      The model introduces itself as Northkey and says truthfully what it is built on;
      upstream docs stay the feature reference.
    edits:
      - find: 'You are Hermes Agent, built by Nous Research.'
        replace: 'You are ⟦name⟧, built on Hermes Agent by Nous Research.'
      - find: 'You run on Hermes Agent (by Nous Research). When the user needs help with Hermes itself'
        replace: 'You run on ⟦name⟧, built on Hermes Agent (by Nous Research). When the user needs help with ⟦name⟧ itself'
        count: 2
      - find: 'You are in the Hermes terminal UI (TUI).'
        replace: 'You are in the ⟦name⟧ terminal UI (TUI).'

  - id: brand-identity-soul
    file: hermes_cli/default_soul.py
    why: >-
      The SOUL.md seeded on first run (kept identical to DEFAULT_AGENT_IDENTITY). Hermes'
      own seeded default counts as auto-seeded, so installs migrated from Hermes upgrade.
    edits:
      - find: 'You are Hermes Agent, built by Nous Research.'
        replace: 'You are ⟦name⟧, built on Hermes Agent by Nous Research.'
      - find: "    DEFAULT_SOUL_MD.replace(\"\\u2014\", \"--\"),\n)"
        replace: "    DEFAULT_SOUL_MD.replace(\"\\u2014\", \"--\"),\n    # northkey: upstream Hermes' seeded default, so installs migrated from Hermes upgrade too.\n    DEFAULT_SOUL_MD.replace(\"You are ⟦name⟧, built on Hermes Agent by Nous Research.\", \"You are Hermes Agent, built by Nous Research.\"),\n    DEFAULT_SOUL_MD.replace(\"You are ⟦name⟧, built on Hermes Agent by Nous Research.\", \"You are Hermes Agent, built by Nous Research.\").replace(\"\\u2014\", \"--\"),\n)"

  - id: brand-identity-docker-soul
    file: docker/SOUL.md
    required: false
    why: The Docker image's seeded SOUL.md.
    edits:
      - find: 'You are Hermes Agent, built by Nous Research.'
        replace: 'You are ⟦name⟧, built on Hermes Agent by Nous Research.'

  - id: brand-identity-oauth
    file: agent/anthropic_adapter.py
    required: false
    why: >-
      Under Anthropic OAuth upstream rewrites "Hermes Agent"/"Nous Research"; drop the
      provenance clause first so no false origin ("built on Claude Code") appears.
    edits:
      - find: '_OAUTH_SYSTEM_REPLACEMENTS = ('
        replace: "_OAUTH_SYSTEM_REPLACEMENTS = (  # northkey: drop the provenance clause before the generic swaps\n    (\"⟦name⟧, built on Hermes Agent by Nous Research\", \"⟦name⟧\"),\n    (\"⟦name⟧, built on Hermes Agent (by Nous Research)\", \"⟦name⟧\"),"

  - id: brand-whatsapp
    file: gateway/platforms/whatsapp_common.py
    why: >-
      Reply prefix. Must equal the bridge's (it detects its own echoes by prefix), so
      both are required and change together.
    edits:
      - find: '☤ *Hermes Agent*'
        replace: '⟦glyph⟧ *⟦name⟧*'

  - id: brand-whatsapp-bridge
    file: scripts/whatsapp-bridge/bridge.js
    why: Reply prefix; must equal gateway/platforms/whatsapp_common.py.
    edits:
      - find: '☤ *Hermes Agent*'
        replace: '⟦glyph⟧ *⟦name⟧*'

  - id: brand-banner
    file: hermes_cli/banner.py
    required: false
    why: Product name in the banner title; release links point at the fork.
    edits:
      - find: '_RELEASE_URL_BASE = "https://github.com/NousResearch/hermes-agent/releases/tag"'
        replace: '_RELEASE_URL_BASE = "https://github.com/⟦repo.slug⟧/releases/tag"  # northkey'
      - find: 'f"Hermes Agent v{get_version_info().derived_version}'
        replace: 'f"⟦name⟧ v{get_version_info().derived_version}'
        count: 2
      - find: 'nous_str = _dim_sep("Nous Research")'
        replace: 'nous_str = _dim_sep("⟦name⟧")'

  - id: brand-version-fast
    file: hermes_cli/_startup_fast.py
    required: false
    why: The `--version` fallback line when the banner label is unavailable.
    edits:
      - find: 'f"Hermes Agent v{get_version_info().derived_version} ({__release_date__})"'
        replace: 'f"⟦name⟧ v{get_version_info().derived_version} ({__release_date__})"'

  - id: brand-banner-compact
    file: hermes_cli/cli_render.py
    required: false
    why: The compact banner used on narrow terminals and fast startup.
    edits:
      - find: 'tiny_line = "☤ NOUS HERMES"'
        replace: 'tiny_line = "⟦glyph⟧ ⟦name_upper⟧"'
      - find: 'f"Hermes Agent v{get_version_info().derived_version}'
        replace: 'f"⟦name⟧ v{get_version_info().derived_version}'
      - find: '[dim {dim_color}]- Nous Research[/]'
        replace: '[dim {dim_color}]- ⟦tagline_short⟧[/]'

  - id: brand-cli-chrome
    file: hermes_cli/cli_status_bar_mixin.py
    required: false
    why: The status bar shown for the whole session.
    edits:
      - find: '☤'
        replace: '⟦glyph⟧'
        count: all
      - find: "else 'Hermes'}\""
        replace: "else '⟦name⟧'}\""

  - id: brand-cli-prompt
    file: hermes_cli/cli_tui_mixin.py
    required: false
    why: The prompt glyph while the agent works.
    edits:
      - find: '_state_fragment("class:prompt-working", "☤")'
        replace: '_state_fragment("class:prompt-working", "⟦glyph⟧")'

  - id: brand-cli-modal
    file: hermes_cli/cli_tui_mixin.py
    required: false
    why: Title of the input-needed modal.
    edits:
      - find: 'title = "Hermes needs your input"'
        replace: 'title = "⟦name⟧ needs your input"'
        count: all

  - id: brand-cli-busy
    file: hermes_cli/cli_commands_mixin.py
    required: false
    why: /busy explanations and the in-session update launch line.
    edits:
      - find: 'while Hermes is busy'
        replace: 'while ⟦name⟧ is busy'
        count: all
      - find: '☤ Launching update...'
        replace: '⟦glyph⟧ Launching update...'

  - id: brand-gateway-update-prompt
    file: gateway/run_notifications.py
    required: false
    why: The chat notice when an update needs an answer.
    edits:
      - find: '☤ **Update needs your input:**'
        replace: '⟦glyph⟧ **Update needs your input:**'

  - id: brand-update-copy
    file: hermes_cli/update_cmd.py
    required: false
    why: What `northkey update` says while it updates.
    edits:
      - find: 'print("☤ Updating Hermes Agent...")'
        replace: 'print("⟦glyph⟧ Updating ⟦name⟧...")'
      - find: '☤ Update available'
        replace: '⟦glyph⟧ Update available'
        count: 2

  - id: brand-update-dialog
    file: hermes_cli/cli_commands_mixin.py
    required: false
    why: The in-session /update dialog.
    edits:
      - find: 'title="☤  Update Hermes Agent",'
        replace: 'title="⟦glyph⟧  Update ⟦name⟧",'
      - find: 'update Hermes Agent'
        replace: 'update ⟦name⟧'
        count: all

  - id: brand-setup-wizard
    file: hermes_cli/setup.py
    required: false
    why: The first-run setup wizard the installer starts.
    edits:
      - find: '☤ Hermes Setup — Non-interactive mode'
        replace: '⟦glyph⟧ ⟦name⟧ Setup — Non-interactive mode'
      - find: 'f"│     ☤ Hermes Setup — {label:<34s} │"'
