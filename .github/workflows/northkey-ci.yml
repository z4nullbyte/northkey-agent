# Northkey CI: proves the fork invariant and runs the fork's tests on every push/PR.
# Runs with a read-only token and no secrets, so it is safe to run upstream code here.
name: Northkey CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: northkey-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariant:
    name: Fork invariant (upstream + owned paths + seams)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.16
      - run: python northkey/tools/nk.py verify --rev HEAD

  report:
    name: Brand coverage report (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.16
      - name: Upstream brand strings on primary surfaces
        run: python northkey/tools/nk.py leaks
      - name: Action pins upstream has moved past
        run: python northkey/tools/nk.py pins

  tests:
    name: Northkey tests + upstream brand-sensitive suites
    needs: invariant
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      - run: uv sync --frozen --python 3.14 --group dev --group test
      - name: Run tests
        env:
          HERMES_PYTHON: ${{ github.workspace }}/.venv/bin/python
        # Upstream suites touched by seams run in full, minus the node ids that pin a
        # value Northkey changes on purpose (northkey/expected-divergence.txt, each
        # re-asserted with Northkey's value in tests/northkey/).
        run: |
          mapfile -t deselect < <(sed 's/#.*//' northkey/expected-divergence.txt | awk 'NF {print "--deselect=" $1}')
          scripts/run_tests.sh \
            tests/northkey \
            tests/test_tests_tree_layout.py \
            tests/hermes_cli/test_skin_palettes.py \
            tests/hermes_cli/test_skin_engine.py \
            tests/hermes_cli/test_skin_cmd.py \
            tests/hermes_cli/test_banner.py \
            tests/hermes_cli/test_source_check.py \
            tests/hermes_cli/test_source_release_channels.py \
            tests/hermes_cli/test_source_channel_integration.py \
            tests/hermes_cli/test_source_launcher_publication.py \
            tests/hermes_cli/test_update_fetch_failure_classifier.py \
            tests/hermes_cli/test_oauth_status_pool_observation.py \
            tests/hermes_cli/test_startup_fast_guards.py \
            tests/hermes_cli/test_timestamps_command.py \
            tests/hermes_cli/test_web_server.py \
            tests/agent/test_anthropic_adapter.py \
            tests/tools/test_approval_mode_parity.py \
            "${deselect[@]}" -q
