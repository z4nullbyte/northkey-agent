# Northkey upstream sync: merges the newest NousResearch/hermes-agent into the fork
# and re-derives the rebrand (northkey/tools/nk.py sync), then opens a PR.
#
# This job holds a write token, so it never installs or runs upstream code: it only
# runs git and nk.py. Northkey CI tests the PR with a read-only token.
#
# Setup (once): add a fine-grained token as the NORTHKEY_SYNC_TOKEN secret with
# Contents, Pull requests and Workflows = read/write on this repository. Workflows
# write is required because upstream edits .github/workflows/ regularly.
name: Northkey upstream sync

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions: {}

concurrency:
  group: northkey-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.NORTHKEY_SYNC_TOKEN }}
      BRANCH: northkey/upstream-sync
    steps:
      - name: Require the sync token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the NORTHKEY_SYNC_TOKEN secret (see the header of this workflow)."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.NORTHKEY_SYNC_TOKEN }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check ruamel.yaml==0.18.16
      - name: Sync upstream and re-derive the rebrand
        id: sync
        run: |
          git config user.name "northkey-sync[bot]"
          git config user.email "northkey-sync@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          python northkey/tools/nk.py sync
          python northkey/tools/nk.py verify --rev HEAD
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Upstream changes to CI or to the update/install path get a human review.
          range="$(jq -r .previous northkey/upstream.lock.json)..$(jq -r .commit northkey/upstream.lock.json)"
          if git diff --name-only "$range" | grep -qE '^(\.github/|hermes_cli/(update_|source_|release_channels|_launchers)|scripts/install)'; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push the sync branch and open a PR
        if: steps.sync.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          lock=northkey/upstream.lock.json
          title="Sync upstream $(jq -r .ref $lock) @ $(jq -r '.commit[:12]' $lock)"
          body="Automated by northkey-upstream-sync. Merges upstream $(jq -r '.previous[:12]' $lock)..$(jq -r '.commit[:12]' $lock) and re-derives the rebrand from northkey/seams.yaml. Merge with **Create a merge commit** so installs keep fast-forwarding."
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$pr" --title "$title" --body "$body"
          fi
          if [ "${{ steps.sync.outputs.review }}" = "true" ]; then
            gh pr edit "$BRANCH" --add-label "needs-review" || true
          else
            gh pr merge "$BRANCH" --auto --merge || echo "Auto-merge unavailable; merge after CI passes."
          fi
